{% extends "base.html" %}{% block title %}線上報修{% endblock %}{% block main %}
<div class="card" style="max-width:560px;margin:1rem auto">
<h1>線上報修</h1>
<p class="soft">填完後會由專人與您聯絡並確認到府時間。送出不代表預約已成立。<br><strong class="bad">如有瓦斯味、冒煙、漏電等立即危險，請先離開現場並撥打 119。</strong></p>
<form method="post" action="/repair">
<p><label>地區（縣市與區域）<input name="area" required maxlength="100" placeholder="台中市西屯區"></label></p>
<p><label>設備 <input name="equipment" required maxlength="100" placeholder="冷氣、冰箱、洗衣機…"></label></p>
<p><label style="display:block">設備狀況<textarea name="problem" required maxlength="300" style="min-height:5rem"></textarea></label></p>
<p><label>方便的時間 <input name="slot" required maxlength="200" placeholder="週三下午、11/20 上午"></label></p>
<p><label>聯絡電話或 LINE ID <input name="contact" required maxlength="100"></label></p>
<p style="position:absolute;left:-9999px" aria-hidden="true"><label>網站 <input name="website" tabindex="-1" autocomplete="off"></label></p>
<button>送出報修</button>
</form>
</div>
{% endblock %}
